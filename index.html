<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5cab"><link rel="manifest" href="manifest.json"><title>Rail Traffic</title><style>body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#17202a}header{background:#0b5cab;color:white;padding:18px 16px;font-size:21px;font-weight:700}main{padding:12px}.card{background:white;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0001}.map{height:300px;border-radius:14px;background:linear-gradient(135deg,#dcebd8,#e9eef4);position:relative;overflow:hidden}.rail{position:absolute;left:8%;right:8%;top:50%;height:5px;background:#555;transform:rotate(-10deg)}.station{position:absolute;font-size:12px;font-weight:700}.train{position:absolute;font-size:24px}.blue{color:#0b5cab}button{width:100%;padding:14px;border:0;border-radius:12px;background:#0b5cab;color:white;font-size:16px}.row{padding:10px 0;border-bottom:1px solid #eee}.small{color:#68737d;font-size:13px}</style></head><body><header>🚆 Rail Traffic<br><span style="font-size:14px;font-weight:400">Kanpur Central → Etawah</span></header><main><div class="card"><b id="summary">Section में 3 दूसरी trains</b><div class="small" id="time"></div></div><div class="card"><div class="map"><div class="rail"></div><span class="station" style="left:5%;top:25%">Kanpur</span><span class="station" style="right:5%;bottom:18%">Etawah</span><span class="train" id="u" style="left:67%;top:45%">🚆</span><span class="train" style="left:38%;top:39%">🚆</span><span class="train" style="left:52%;top:52%">🚆</span><span class="train" style="left:61%;top:35%">🚆</span></div></div><div class="card" id="list"></div><button onclick="refresh()">🔄 Refresh</button></main><script>const trains=[['12345','Express',76,58,'चल रही है'],['22400','Superfast',91,0,'रुकी हुई'],['12560','Passenger',103,42,'चल रही है']];function refresh(){document.getElementById('time').textContent='Last update: '+new Date().toLocaleTimeString('hi-IN');document.getElementById('list').innerHTML=trains.map(t=>`<div class="row">🚆 <b>${t[0]} ${t[1]}</b><br><span class="small">KM ${t[2]} • ${t[3]} km/h • ${t[4]}</span></div>`).join('')}refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
